version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cmms-app
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: cmms_dev
      DB_USERNAME: cmms_user
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cmms

  mysql:
    image: mysql:8.0
    container_name: cmms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cmms_dev
      MYSQL_USER: cmms_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cmms_user", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cmms

  redis:
    image: redis:7-alpine
    container_name: cmms-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cmms

  nginx:
    image: nginx:alpine
    container_name: cmms-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - cmms

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: cmms-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: cmms_user
      PMA_PASSWORD: secret
      PMA_ROOT_PASSWORD: root
    ports:
      - "8001:80"
    depends_on:
      - mysql
    networks:
      - cmms

volumes:
  mysql_data:

networks:
  cmms:
    driver: bridge
