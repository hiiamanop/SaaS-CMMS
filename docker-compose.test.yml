version: '3.8'

services:
  app:
    image: php:8.3-fpm-alpine
    container_name: cmms-test
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - APP_ENV=testing
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=cmms_test
      - DB_USERNAME=cmms_user
      - DB_PASSWORD=secret
    depends_on:
      - mysql
    command: sh -c "apk add --no-cache composer curl mysql-client && composer install && php artisan migrate:fresh && php artisan test"

  mysql:
    image: mysql:8.0-alpine
    container_name: cmms-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cmms_test
      MYSQL_USER: cmms_user
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql

volumes:
  mysql_test_data:
